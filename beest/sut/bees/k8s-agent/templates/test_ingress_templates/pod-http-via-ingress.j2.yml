---
apiVersion: v1
kind: Pod
metadata:
  name: pod-http-via-ingress-apple
  labels:
    test: pod-http-via-ingress-apple
spec:
  containers:
    - name: pod-http-via-ingress-apple
      image: quay.io/stackstate/continuous-requests-py:e841a539
      env:
        - name: URL
          value: "http://{{nginx_controller_external_ip}}/apple"
        - name: INTERVAL
          value: "2"
