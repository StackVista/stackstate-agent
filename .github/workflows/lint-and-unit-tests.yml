name: Lint and unit tests

# Ported from .gitlab-ci-agent.yml (filename_linting, unbranded_unit_tests,
# branded_unit_tests) as part of the GitLab -> GitHub migration (STAC-25142),
# phase 1: lint + unit tests. Tracks the stackstate-7.78.2 pipeline.
#
# Test-execution policy (architect directive — minimize redundant runs):
#   * filename-linting is a cheap gate and runs on every PR.
#   * The two unit suites are heavy (each does a full `inv agent.build` + full
#     `inv test`, ~2h on an XL runner). They run ONCE per change here, deduped
#     via `concurrency: cancel-in-progress`. When the merge queue is enabled
#     (phase 6) they move to `merge_group` (run once at land) and drop from
#     `pull_request`; master/version-branch pushes then build+publish WITHOUT
#     re-running tests. Follow-ups tracked in the migration scope doc:
#       - path-filter the heavy suites (skip when no Go/build inputs changed)
#       - open question for architects: do we need BOTH unbranded and branded
#         on every path, or branded-as-gate + unbranded on the queue only?
#
# Prerequisites for a GREEN run (see scope doc):
#   * The GitLab push mirror to this repo must be disabled (done 2026-07-10),
#     otherwise a mirror sync overwrites anything pushed to GitHub.
#   * This is a PUBLIC repo. The read-only registry-proxy credentials must be
#     available to it (org-inherited or provisioned via pulumi-infra) to pull the
#     cache image: vars REGISTRY_HOST, REGISTRY_USER + secret REGISTRY_PASSWORD.
#     The godeps-cache build job additionally needs quay push credentials (var
#     QUAY_USER + secret QUAY_PASSWORD). The warm Go module cache is delivered by
#     the godeps-cache reusable workflow (STAC-25429; see build-binaries.yml header
#     and .github/workflows/godeps-cache.yml). Org secrets are never exposed to fork
#     PRs, so external-fork PRs skip these jobs.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      force_mod_tidy:
        description: Run the go.mod tidiness check even when the module graph is unchanged.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The datadog_build container's default shell is dash, which lacks `set -o pipefail`
# and mis-handles the conda activation the steps rely on; force bash.
defaults:
  run:
    shell: bash

env:
  # conda env baked into the datadog_build image.
  CONDA_ENV: ddpy3

jobs:
  godeps-cache:
    name: Go dependency cache image
    # Same-repo PRs only: the registry/quay secrets are not exposed to fork PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/godeps-cache.yml
    # Designated builder of the cache image (STAC-25494): no wait, so this workflow --
    # the longest of the three -- is never held up. The other two wait it out.
    with:
      build_delay_seconds: 0
    secrets:
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}

  filename-linting:
    name: Filename linting
    # Same-repo PRs only: the registry-proxy secret is not exposed to fork PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: docker-public
    timeout-minutes: 20
    container:
      # datadog_build image (built by datadog-agent-buildimages), pulled via the
      # read-only quay proxy — mirrors BUILD_IMAGE in .gitlab-ci.yml (7.78.2 tag).
      image: ${{ vars.REGISTRY_HOST }}/quay/stackstate/datadog_build_linux_x64:7af9194f
      credentials:
        username: ${{ vars.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: inv linter.filenames
        run: |
          set -eo pipefail
          # linter.filenames only shells out to `git ls-files` + path checks, so
          # it needs no Go deps/vendoring (the GitLab job carried that as boilerplate).
          . /root/miniforge3/etc/profile.d/conda.sh
          conda activate "${CONDA_ENV}"
          # Work volume is owned by the ARC runner uid but the job container runs as
          # root, so git rejects the repo as "dubious ownership"; mark it safe.
          git config --global --add safe.directory '*'
          inv -e linter.filenames

  mod-tidy:
    name: Go module tidiness (go.mod / go.sum)
    # Nothing in this repo's CI has ever verified module tidiness (STAC-25459):
    # `inv deps` only downloads, and the `go mod tidy` that used to sit in the GitLab
    # reconcile mutated the tree rather than failing on a diff. `inv check-mod-tidy`
    # has always existed (tasks/go.py) and does fail on a diff -- it was just never wired up.
    #
    # Gated on the godeps-cache tag, which is a sha256 over exactly **/go.mod,
    # **/go.sum, go.work, go.work.sum and modules.yml. `image_exists == true` therefore
    # means those files are byte-identical to a tree this check already passed on: the
    # cache tag doubles as the cached verdict, so the check costs nothing on the PRs
    # that do not touch the module graph. Dispatch with force_mod_tidy to re-run it
    # against an unchanged graph.
    #
    # Blind spot: a source-only change that drops the last import of a dependency
    # leaves a stale `require` without touching any hashed file, so this stays skipped.
    # That does not break builds; a scheduled force_mod_tidy run would cover it.
    if: >-
      ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (needs.godeps-cache.outputs.image_exists != 'true' || inputs.force_mod_tidy) }}
    needs: godeps-cache
    # XL for headroom: check-mod-tidy walks all ~186 workspace modules serially and
    # holds the full module graph. Revisit once there is a wall-clock measurement.
    runs-on: xlarge-public
    timeout-minutes: 60
    container:
      # Warm Go module cache image (godeps-cache job); see the unit-test jobs below
      # for why this ref cannot be a static digest.
      image: ${{ needs.godeps-cache.outputs.ci_image }} # zizmor: ignore[unpinned-images]
      credentials:
        username: ${{ vars.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # No fetch-depth: check-mod-tidy diffs the working tree, not history.
          persist-credentials: false

      - name: inv check-mod-tidy
        run: |
          set -eo pipefail
          export PATH="$PATH:/usr/local/go/bin"
          . /root/miniforge3/etc/profile.d/conda.sh
          conda activate "${CONDA_ENV}"
          # check-mod-tidy reports by mutating the tree (`go work sync`, then `go mod
          # tidy` per module) and diffing it, so git has to accept the checkout.
          git config --global --add safe.directory '*'
          # `go mod tidy` resolves the full module graph including test dependencies of
          # dependencies, which is wider than the `go mod download` set baked into the
          # cache image, so expect some network fetches here even on a warm cache.
          inv -e check-mod-tidy

  unbranded-unit-tests:
    name: Unit tests (unbranded / DataDog)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: godeps-cache
    runs-on: xlarge-public
    timeout-minutes: 150
    container:
      # Warm Go module cache image (godeps-cache job); pulled via the same
      # read-only registry proxy + REGISTRY_* credentials as datadog_build. The tag is
      # a sha256 content hash of the module graph (see godeps-cache.yml), so this ref
      # is effectively digest-pinned; it cannot be a static digest because it is
      # computed per run -- hence the narrow unpinned-images ignore below.
      image: ${{ needs.godeps-cache.outputs.ci_image }} # zizmor: ignore[unpinned-images]
      credentials:
        username: ${{ vars.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Full history + tags so `inv agent.build` resolves the version via
          # `git describe --tags --match "3.*"` (needs the 3.x tag reachable from HEAD).
          fetch-depth: 0

      - name: Build agent and run unit tests
        run: |
          set -eo pipefail
          export PATH="$PATH:/usr/local/go/bin"
          . /root/miniforge3/etc/profile.d/conda.sh
          conda activate "${CONDA_ENV}"
          # Work volume is owned by the ARC runner uid but the job container runs as
          # root, so git rejects the repo as "dubious ownership"; mark it safe.
          git config --global --add safe.directory '*'
          # GOMODCACHE is pre-warmed by the godeps-cache image (STAC-25429), keyed
          # to the module-graph hash: no `go clean -modcache` and no per-job
          # `inv deps` reconcile. Materialise vendor/ against the warm cache
          # (offline). Go tool binaries come from `invoke install-tools` below --
          # the removed second `inv deps` never installed them (it is go mod
          # download + tidy, not a tool install).
          go work sync
          go work vendor
          export AGENT_GITHUB_ORG=DataDog
          export GITHUB_ORG=DataDog
          export BRANDED=false
          export AGENT_REPO_NAME=datadog-agent
          inv -e agent.build --race
          gofmt -l -w -s ./pkg ./cmd
          inv -e rtloader.test
          invoke install-tools
          # Go 1.25+ no longer ships prebuilt tool binaries; build covdata into
          # GOTOOLDIR so `go test -cover` resolves it (golang/go#75031).
          go build -o "$(go env GOTOOLDIR)/covdata" cmd/covdata
          # Drop build tags for features StackState does not ship in its images.
          export STS_UT_BUILD_EXCLUDE="oracle,trivy,trivy_no_javadb,nvml,jetson,bundle_installer,systemd"
          inv -e test --coverage --race --profile --cpus 4 --build-exclude="${STS_UT_BUILD_EXCLUDE}" --timeout=600

  branded-unit-tests:
    name: Unit tests (branded / StackState)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: godeps-cache
    runs-on: xlarge-public
    timeout-minutes: 150
    container:
      # Warm Go module cache image (godeps-cache job); pulled via the same
      # read-only registry proxy + REGISTRY_* credentials as datadog_build. The tag is
      # a sha256 content hash of the module graph (see godeps-cache.yml), so this ref
      # is effectively digest-pinned; it cannot be a static digest because it is
      # computed per run -- hence the narrow unpinned-images ignore below.
      image: ${{ needs.godeps-cache.outputs.ci_image }} # zizmor: ignore[unpinned-images]
      credentials:
        username: ${{ vars.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Full history + tags so `inv agent.build` resolves the version via
          # `git describe --tags --match "3.*"` (needs the 3.x tag reachable from HEAD).
          fetch-depth: 0

      - name: Build agent and run unit tests
        run: |
          set -eo pipefail
          export PATH="$PATH:/usr/local/go/bin"
          . /root/miniforge3/etc/profile.d/conda.sh
          conda activate "${CONDA_ENV}"
          # Work volume is owned by the ARC runner uid but the job container runs as
          # root, so git rejects the repo as "dubious ownership"; mark it safe.
          git config --global --add safe.directory '*'
          # GOMODCACHE is pre-warmed by the godeps-cache image (STAC-25429): no
          # `go clean -modcache` and no per-job `inv deps` reconcile. Materialise
          # vendor/ against the warm cache (offline). Go tool binaries come from
          # `invoke install-tools` below.
          go work sync
          go work vendor
          export AGENT_GITHUB_ORG=DataDog
          export GITHUB_ORG=DataDog
          export BRANDED=true
          export AGENT_REPO_NAME=datadog-agent
          export OMNIBUS_FORCE_PACKAGES=true
          # Rebrand DataDog -> StackState, then verify no unbranded literals remain.
          # fix_branding.sh defaults its target dir to $CI_PROJECT_DIR (a GitLab
          # built-in that is unset here); pass the checkout root explicitly.
          ./fix_branding.sh "${GITHUB_WORKSPACE}"
          ./scripts/verify_branding_literals.sh
          inv -e agent.build --race
          gofmt -l -w -s ./pkg ./cmd
          inv -e rtloader.test
          invoke install-tools
          go build -o "$(go env GOTOOLDIR)/covdata" cmd/covdata
          export STS_UT_BUILD_EXCLUDE="oracle,trivy,trivy_no_javadb,nvml,jetson,bundle_installer,systemd"
          inv -e test --coverage --race --profile --cpus 4 --build-exclude="${STS_UT_BUILD_EXCLUDE}" --timeout=600
