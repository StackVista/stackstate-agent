name: Agent 11da0d93 delivery verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.kind }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: "agent"
            arch: "amd64"
            runner: "ubuntu-24.04"
            image: "quay.io/stackstate/stackstate-k8s-agent"
            arch_digest: "sha256:3e6837de69483f61139a89e9fbf379cc5bdd41527b03e3a1f1724e461e96ab8f"
            index_digest: "sha256:70d6089a32a433d75152a508644680f92cf490a38682e0c9d07bf41043667b9c"
            runtime_digest: "sha256:e57d283eb36581c71b294ecb48d81f6e048246f59259c75611dd8a590c222003"
          - kind: "agent"
            arch: "arm64"
            runner: "ubuntu-24.04-arm"
            image: "quay.io/stackstate/stackstate-k8s-agent"
            arch_digest: "sha256:46bf54d62a925d092c3faa1fd0d913de5f58e210e6d694ff817c43c9f68c98b8"
            index_digest: "sha256:70d6089a32a433d75152a508644680f92cf490a38682e0c9d07bf41043667b9c"
            runtime_digest: "sha256:f6d6adda50feabb410957661cd5fea2f78e31cf5b24802b729854b1bfaea8c04"
          - kind: "cluster-agent"
            arch: "amd64"
            runner: "ubuntu-24.04"
            image: "quay.io/stackstate/stackstate-k8s-cluster-agent"
            arch_digest: "sha256:15d5df565dceb968b472f20d9146eafdf8af998dd44caa71506266da07705b42"
            index_digest: "sha256:351bc1e104f87e399c578980c9f6b8824a0554f2e20fbc2ad617be0555e766e6"
            runtime_digest: "sha256:a627b8e3f4d25abee48e9f8c26d2f2477698b1aec640cd169b05b9bd68300c0d"
          - kind: "cluster-agent"
            arch: "arm64"
            runner: "ubuntu-24.04-arm"
            image: "quay.io/stackstate/stackstate-k8s-cluster-agent"
            arch_digest: "sha256:ee7df8e1aed7cf1042fc5ddc2d1747e86c88b8f6e52196b4484a49cf1274a2dd"
            index_digest: "sha256:351bc1e104f87e399c578980c9f6b8824a0554f2e20fbc2ad617be0555e766e6"
            runtime_digest: "sha256:dae4889875b8e8cdf6dff788355640896b5be0cacfbebcc863ac1e09d47bec7c"
    env:
      IMAGE: ${{ matrix.image }}
      ARCH_DIGEST: ${{ matrix.arch_digest }}
      INDEX_DIGEST: ${{ matrix.index_digest }}
      RUNTIME_DIGEST: ${{ matrix.runtime_digest }}
      ARCH: ${{ matrix.arch }}
      KIND: ${{ matrix.kind }}
      SOURCE_SHA: 11da0d9300ac1fc5a7a80e91eaff3bbf3cb12259
    steps:
      - name: Check out published source and maintained regression inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 11da0d9300ac1fc5a7a80e91eaff3bbf3cb12259
          persist-credentials: false
      - name: Check out maintained publication verifier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: StackVista/image-pipeline
          ref: 27cf07bd5f5f3bafdb714e3b24d72d85480d2a60
          path: publication-tools
          persist-credentials: false
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify both signature formats and manifest membership
        run: |
          set -euo pipefail
          mkdir -p verification
          python3 - <<'PYVERIFY'
          import importlib.util, json, os, subprocess
          from pathlib import Path
          source = Path('publication-tools/.github/actions/merge-multiarch/publish.py')
          spec = importlib.util.spec_from_file_location('publisher', source)
          publisher = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(publisher)
          identity = r'^https://github.com/StackVista/stackstate-agent/.*@refs/heads/stackstate-7.78.2$'
          for name in ('ARCH_DIGEST', 'INDEX_DIGEST'):
              ref = os.environ['IMAGE'] + '@' + os.environ[name]
              for bundle in (False, True):
                  result = publisher.verify_signature(ref, bundle, identity)
                  if result.returncode:
                      raise RuntimeError(result.stderr)
                  Path(f'verification/{name}-{bundle}.json').write_text(result.stdout)
              result = subprocess.run(['docker', 'manifest', 'inspect', ref], capture_output=True, text=True, check=True)
              manifest = json.loads(result.stdout)
              assert any(m.get('digest') == os.environ['RUNTIME_DIGEST'] and m.get('platform') == {'architecture': os.environ['ARCH'], 'os': 'linux'} for m in manifest['manifests'])
              Path(f'verification/{name}-manifest.json').write_text(result.stdout)
          PYVERIFY
      - name: Verify published architecture, revision and startup
        run: |
          set -euo pipefail
          ref="${IMAGE}@${ARCH_DIGEST}"
          docker pull --platform "linux/${ARCH}" "${ref}"
          docker image inspect "${ref}" > verification/image-inspect.json
          jq -e --arg arch "${ARCH}" --arg sha "${SOURCE_SHA}"             '.[0].Architecture == $arch and .[0].Config.Labels["org.opencontainers.image.revision"] == $sha'             verification/image-inspect.json
          if [ "${KIND}" = "cluster-agent" ]; then
            binary=/opt/stackstate-agent/bin/stackstate-cluster-agent/stackstate-cluster-agent
          else
            binary=/opt/stackstate-agent/bin/agent/agent
          fi
          docker run --rm --platform "linux/${ARCH}" --entrypoint "${binary}" "${ref}" version
      - name: Verify embedded Python security regressions
        if: matrix.kind == 'agent'
        run: |
          set -euo pipefail
          docker run --rm -i --platform "linux/${ARCH}"             --entrypoint /opt/stackstate-agent/embedded/bin/python3             "${IMAGE}@${ARCH_DIGEST}" - < scripts/test_embedded_python_security.py
      - name: Scan the published digest with existing policy
        uses: StackVista/image-pipeline/.github/actions/scan-image@ec325c73909d0d00420121bbde6754b964e80ac3
        with:
          image: ${{ matrix.image }}@${{ matrix.arch_digest }}
          mode: inform
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          with-grype: true
          exceptions-path: exceptions
          upload-sarif: false
      - name: Retain digest verification and scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-delivery-${{ matrix.kind }}-${{ matrix.arch }}
          path: |
            verification/
            reports/trivy.json
            reports/grype.json
            reports/image-pipeline.sarif
          if-no-files-found: error
