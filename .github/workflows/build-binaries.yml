name: Binary builds

# Ported from .gitlab-ci-agent.yml (build_binaries, build_cluster_agent) as part
# of the GitLab -> GitHub migration (STAC-25142), phase 2: binary builds. Tracks
# the stackstate-7.78.2 pipeline. Builds the branded (StackState) production agent
# and cluster-agent from the DataDog fork, validating that the shippable binaries
# compile on GitHub runners before the packaging/image phases build on top of them.
#
# Speedup concepts carried over from the GitLab pipeline work (STAC-25396) and the
# warm-cache follow-up (STAC-25429):
#   * WARM Go module cache via a prebuilt cache image (STAC-25429), keyed by a hash
#     of the module graph -- the StackGraph ci-metadata/build-ci-image pattern. The
#     godeps-cache reusable workflow (.github/workflows/godeps-cache.yml) publishes
#     an image FROM datadog_build with all external modules baked into GOMODCACHE;
#     the build jobs use it as their `container:` so the cache is already warm. This
#     replaces the earlier "each job cold-reconciles its own deps" approach: there
#     is no `go clean -modcache` and no per-job `inv deps` (go mod download + tidy).
#     The module cache is too big to transport via actions/cache (~540k files,
#     2-3 GB), which is why it ships as an image layer instead. Jobs still run
#     `go work sync` + `go work vendor` per checkout (vendoring mutates go.mod, so
#     vendor/ is materialised per job) -- but now against the warm cache, offline.
#   * deps_deb's only genuinely consumed output was version.txt, which is git-based
#     (inv agent.version), not module-cache-based -- so build-cluster-agent just
#     generates it in-job rather than pulling it from an upstream job.
#   * Each suite runs once on the path to master, deduped via
#     `concurrency: cancel-in-progress` (a newer push cancels the in-flight build).
#
# Known follow-ups:
#   * go.mod tidiness is no longer verified in these jobs (the `inv deps` reconcile
#     is gone). Add a single check-mod-tidy gate rather than paying tidy in every job.
#   * Phase 6 (merge queue): move the heavy builds to `merge_group` so they run
#     once at land time and drop from `pull_request`; master/version-branch pushes
#     then build + publish without re-running these.
#
# Prerequisites for a GREEN run: the GitLab push mirror must stay disabled, and this
# PUBLIC repo needs the read-only registry-proxy credentials (vars REGISTRY_HOST/
# REGISTRY_USER + secret REGISTRY_PASSWORD) to pull the cache image, plus quay push
# credentials (var QUAY_USER + secret QUAY_PASSWORD) for the godeps-cache build job.
# The cache image is PRIVATE (its base datadog_build is private). Org secrets are
# never exposed to fork PRs, so external-fork PRs skip these jobs by design.

on:
  pull_request:
  # The release branch, so a failure there reaches Slack via Cerberus
  # (STAC-25461). Moves with the release; GitLab hardcoded it the same way
  # (`only: - stackstate-7.78.2`).
  push:
    branches:
      - stackstate-7.78.2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The datadog_build container's default shell is dash, which lacks `set -o pipefail`
# and mis-handles the conda activation the steps rely on; force bash.
defaults:
  run:
    shell: bash

env:
  # conda env baked into the datadog_build image.
  CONDA_ENV: ddpy3

jobs:
  godeps-cache-amd64:
    name: Go dependency cache image (amd64)
    # Same-repo PRs only: the registry/quay secrets are not exposed to fork PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/godeps-cache.yml
    # Wait for Lint and unit tests to publish the image before building it here
    # (STAC-25494). Covers a ~7m build plus runner scheduling; on timeout this builds
    # it itself, so a failed sibling costs latency, not correctness.
    with:
      arch: amd64
      build_delay_seconds: 900
    secrets:
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}

  godeps-cache-arm64:
    name: Go dependency cache image (arm64)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/godeps-cache.yml
    # Designated builder of the arm64 cache image, hence delay 0. Lint and unit tests
    # plays that role for amd64 but has no arm64 lane, so if this workflow also waited
    # nothing would ever build the arm64 image inside the delay window and both arm64
    # consumers would build it at once -- the duplicate-build case STAC-25494 fixed.
    with:
      arch: arm64
      build_delay_seconds: 0
    secrets:
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}

  build-agent:
    name: Build agent binary (branded / StackState, ${{ matrix.arch }})
    # Same-repo PRs only: the registry-proxy secret is not exposed to fork PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs:
      - godeps-cache-amd64
      - godeps-cache-arm64
    strategy:
      # An arm64 regression must not abort the amd64 leg: amd64 is the lane that has
      # been green for weeks, and during arm64 bring-up its result is the signal.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: xlarge-public
            cache_image: ${{ needs.godeps-cache-amd64.outputs.ci_image }}
          - arch: arm64
            runner: arm64-xlarge-public
            cache_image: ${{ needs.godeps-cache-arm64.outputs.ci_image }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    container:
      # Warm Go module cache image (godeps-cache job); pulled via the same
      # read-only registry proxy + REGISTRY_* credentials as datadog_build. The tag is
      # a sha256 content hash of the module graph (see godeps-cache.yml), so this ref
      # is effectively digest-pinned; it cannot be a static digest because it is
      # computed per run -- hence the narrow unpinned-images ignore below.
      image: ${{ matrix.cache_image }} # zizmor: ignore[unpinned-images]
      credentials:
        username: ${{ vars.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Full history + tags so `inv agent.build` resolves the version via
          # `git describe --tags --match "3.*"` (needs the 3.x tag reachable from HEAD).
          fetch-depth: 0

      - name: Build branded agent (production, with rtloader)
        run: |
          set -eo pipefail
          export PATH="$PATH:/usr/local/go/bin"
          . /root/miniforge3/etc/profile.d/conda.sh
          conda activate "${CONDA_ENV}"
          # Work volume is owned by the ARC runner uid but the job container runs as
          # root, so git rejects the repo as "dubious ownership"; mark it safe.
          git config --global --add safe.directory '*'
          # GOMODCACHE is pre-warmed by the godeps-cache image (STAC-25429), keyed
          # to the module-graph hash, so there is no `go clean -modcache` and no
          # per-job `inv deps` (go mod download + tidy) reconcile. Materialise
          # vendor/ for this checkout against the warm cache (offline; no download).
          go work sync
          go work vendor
          # rtloader is the C++/Python bridge the full agent links against; the
          # cluster-agent doesn't need it, but the production agent does.
          inv -e rtloader.make
          inv -e rtloader.install
          export AGENT_GITHUB_ORG=DataDog
          export GITHUB_ORG=DataDog
          export BRANDED=true
          export AGENT_REPO_NAME=datadog-agent
          # Rebrand DataDog -> StackState. fix_branding.sh defaults its target dir to
          # $CI_PROJECT_DIR (a GitLab built-in that is unset here); pass the checkout
          # root explicitly.
          ./fix_branding.sh "${GITHUB_WORKSPACE}"
          # Production (non-race) build -- the shippable binary, distinct from the
          # race-instrumented build in the unit-test workflow.
          inv -e agent.build
          ls -la bin/agent

  build-cluster-agent:
    name: Build cluster-agent binary (branded / StackState, ${{ matrix.arch }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs:
      - godeps-cache-amd64
      - godeps-cache-arm64
    strategy:
      # An arm64 regression must not abort the amd64 leg: amd64 is the lane that has
      # been green for weeks, and during arm64 bring-up its result is the signal.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: xlarge-public
            cache_image: ${{ needs.godeps-cache-amd64.outputs.ci_image }}
          - arch: arm64
            runner: arm64-xlarge-public
            cache_image: ${{ needs.godeps-cache-arm64.outputs.ci_image }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    container:
      # Warm Go module cache image (godeps-cache job); pulled via the same
      # read-only registry proxy + REGISTRY_* credentials as datadog_build. The tag is
      # a sha256 content hash of the module graph (see godeps-cache.yml), so this ref
      # is effectively digest-pinned; it cannot be a static digest because it is
      # computed per run -- hence the narrow unpinned-images ignore below.
      image: ${{ matrix.cache_image }} # zizmor: ignore[unpinned-images]
      credentials:
        username: ${{ vars.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Full history + tags so the version resolves via `git describe`.
          fetch-depth: 0

      - name: Build branded cluster-agent
        run: |
          set -eo pipefail
          export PATH="$PATH:/usr/local/go/bin"
          . /root/miniforge3/etc/profile.d/conda.sh
          conda activate "${CONDA_ENV}"
          # Work volume is owned by the ARC runner uid but the job container runs as
          # root, so git rejects the repo as "dubious ownership"; mark it safe.
          git config --global --add safe.directory '*'
          # GOMODCACHE is pre-warmed by the godeps-cache image (STAC-25429); no
          # `go clean -modcache` and no per-job `inv deps` reconcile. Materialise
          # vendor/ for this checkout against the warm cache (offline; no download).
          go work sync
          go work vendor
          export AGENT_GITHUB_ORG=DataDog
          export GITHUB_ORG=DataDog
          export BRANDED=true
          export AGENT_REPO_NAME=datadog-agent
          # Rebrand DataDog -> StackState; pass the checkout root (CI_PROJECT_DIR is GitLab-only).
          ./fix_branding.sh "${GITHUB_WORKSPACE}"
          inv -e cluster-agent.build
          # version.txt is a build artifact for the downstream packaging/image phases.
          # deps_deb produced it on GitLab; there is no shared deps job here, so
          # generate it in-job. inv agent.version is git-based (not module-cache-based)
          # and cheap. No `-e`: its stdout must be only the version string.
          inv agent.version -u > version.txt
          ls -la bin/stackstate-cluster-agent

      - name: Upload cluster-agent build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Per-arch name: matrix legs upload concurrently and actions/upload-artifact
          # v4 rejects a second upload to an existing artifact name, so a shared name
          # would fail the arm64 leg outright.
          name: cluster-agent-binary-${{ matrix.arch }}
          # Paths match the GitLab build_cluster_agent artifacts; the cluster-agent
          # image phase (phase 5) consumes the binary + Dockerfile manifest.
          path: |
            bin/stackstate-cluster-agent/
            Dockerfiles/cluster-agent/stackstate-cluster.yaml
            version.txt
          retention-days: 5
          if-no-files-found: error

  build-cluster-agent-image:
    name: Build cluster-agent container image (docker build, no push on PR, ${{ matrix.arch }})
    # Ported from pre_release_cluster_agent_image. Lives in this workflow rather
    # than build-deb.yml so it can `needs:` the job that produces its input --
    # cross-workflow artifact hand-off would need run-id plumbing for no gain.
    # Stops at `docker build` + a runtime check: the GitLab job also pushed to
    # quay.io/stackstate, which the PR lane of a PUBLIC repo must not do.
    # Publishing lands in phase 4, gated on the branch.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # `needs` on a matrix job waits for every leg, so the arm64 image build also
    # waits out the amd64 binary. Actions has no per-leg dependency; the cost is
    # latency on an already-parallel lane, not correctness.
    needs: build-cluster-agent
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: docker-public
          - arch: arm64
            runner: arm64-xlarge-public
    # DinD class: docker CLI in the runner image, dockerd in a native sidecar.
    # Native per arch -- the binary and the Dockerfile's base stages are both
    # arch-specific, so this cannot be cross-built without QEMU.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      LOCAL_IMAGE: stackstate-cluster-agent:ci-${{ matrix.arch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download cluster-agent binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cluster-agent-binary-${{ matrix.arch }}

      - name: Log in to the registry proxy
        env:
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
          REGISTRY_USER: ${{ vars.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -eo pipefail
          # Dockerfiles/cluster-agent pulls its ubuntu builder stage through the
          # proxy; the BCI stages come from registry.suse.com and need no auth.
          printf '%s' "${REGISTRY_PASSWORD}" | docker login -u "${REGISTRY_USER}" --password-stdin "${REGISTRY_HOST}"

      - name: Build cluster-agent image
        run: |
          set -eo pipefail
          # actions/download-artifact does not preserve the executable bit (GitLab
          # artifacts did). The Dockerfile's `chmod +x` targets
          # opt/stackstate-agent/bin/stackstate-cluster-agent, which is the enclosing
          # DIRECTORY, not the binary inside it -- so nothing in the build restores
          # it and the image ships a non-executable agent.
          chmod +x bin/stackstate-cluster-agent/stackstate-cluster-agent
          # bin/stackstate-cluster-agent is a DIRECTORY (binary + dist/), and it
          # must stay one: the Dockerfile COPYs it to
          # /opt/stackstate-agent/bin/stackstate-cluster-agent/ and entrypoint.sh
          # puts that directory on PATH so CMD can exec `stackstate-cluster-agent`
          # by name. Flattening it to a bare binary breaks the image.
          cp -r bin/stackstate-cluster-agent Dockerfiles/cluster-agent/
          docker build -t "${LOCAL_IMAGE}" Dockerfiles/cluster-agent

      - name: Smoke test cluster-agent image
        run: |
          set -eo pipefail
          # Bypass entrypoint.sh: it hard-exits without STS_API_KEY, which a
          # version check has no business needing.
          docker run --rm \
            --entrypoint /opt/stackstate-agent/bin/stackstate-cluster-agent/stackstate-cluster-agent \
            "${LOCAL_IMAGE}" version

  # Terminal job: report a failed build of the release branch to the team's Slack
  # CI channel (STAC-25461, replacing GitLab's `notify-on-master-fail`). PRs never
  # reach it -- the `push` filter above only carries the release branch, so the
  # event check is the whole gate. `needs` lists every job, not just the leaves, so
  # an early failure that skips its dependents is still reported.
  cerberus-notify:
    name: Report failure to Slack (Cerberus)
    needs:
      - godeps-cache-amd64
      - godeps-cache-arm64
      - build-agent
      - build-cluster-agent
      - build-cluster-agent-image
    if: >-
      always()
      && github.event_name == 'push'
      && contains(needs.*.result, 'failure')
    uses: ./.github/workflows/cerberus-notify.yml
    with:
      suite: binary-builds
    secrets:
      CERBERUS_LAMBDA_URL: ${{ secrets.CERBERUS_LAMBDA_URL }}
      CERBERUS_API_TOKEN: ${{ secrets.CERBERUS_API_TOKEN }}
