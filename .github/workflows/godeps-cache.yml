name: Go dependency cache image

# Reusable workflow (STAC-25429): builds and publishes a Go module cache image for
# stackstate-agent CI, keyed by a hash of the module graph. Mirrors the StackGraph
# ci-metadata / build-ci-image pattern (its .github/workflows/ci.yml): the image tag
# is content-addressed, so an unchanged dependency graph reuses an already-published
# image across every branch/PR/default build (the tag *is* the cache key), and the
# heavy Go module download only runs when the graph actually changes.
#
# The image is FROM the datadog_build CI image with the workspace's external modules
# baked into GOMODCACHE. It is pushed to the dedicated quay repo
# quay.io/stackstate/stackstate-agent-godeps-cache and pulled by consumer jobs through
# the registry.tooling quay proxy with the same read-only REGISTRY_* credentials they
# already use for datadog_build.
#
# Both that repo and the datadog_build base are public (terraform-infra quay/locals.tf).
# Nothing private is baked in: this repo is open source and the module set is already
# public in the committed go.mod files. Public read also keeps the pull path off the
# registry.tooling proxy robot's private-repo grants, which it does not hold.
#
# Dedicated repo, not the shared sts-ci-images: that one also holds the ARC runner
# images, and stackstate-agent is PUBLIC, so any org member's same-repo branch can use
# whatever push credential this workflow carries. Scoping it to a rebuildable cache
# keeps a compromised branch away from the images the CI fleet boots from.

on:
  workflow_call:
    inputs:
      base_image_tag:
        description: Tag of the datadog_build_linux_x64 base image the cache derives FROM.
        type: string
        default: "7af9194f"
      build_delay_seconds:
        description: >-
          How long to wait for a sibling workflow to publish the cache image before
          building it here. Consumers stagger this so one builds immediately and the
          rest wait out a normal build first. See the build job for why this is not a
          concurrency group.
        type: number
        default: 0
    outputs:
      ci_image:
        description: Proxy pull ref of the cache image, for use as a consumer job `container.image`.
        value: ${{ jobs.metadata.outputs.ci_image }}
      image_exists:
        description: Whether the computed cache image tag already exists in the registry.
        value: ${{ jobs.metadata.outputs.image_exists }}
    secrets:
      REGISTRY_PASSWORD:
        description: Password for the read-only registry.tooling quay proxy (pull the base image).
        required: true
      QUAY_PASSWORD:
        description: Password for quay.io/stackstate (inspect + push the cache image).
        required: true

permissions:
  contents: read

jobs:
  metadata:
    name: Compute cache image tag and look up existing image
    runs-on: docker-public
    timeout-minutes: 15
    outputs:
      ci_image: ${{ steps.metadata.outputs.ci_image }}
      image_exists: ${{ steps.metadata.outputs.image_exists }}
    env:
      QUAY_REGISTRY: quay.io
      REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
      QUAY_USER: ${{ vars.QUAY_USER }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      BASE_IMAGE_TAG: ${{ inputs.base_image_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Compute cache image metadata and check existence
        id: metadata
        run: |
          set -euo pipefail
          source .github/scripts/agent-godeps-cache-metadata.sh
          agent_godeps_compute_metadata

          # Presence-gated login: same-repo runs have QUAY_* wired; a run without
          # them still computes the tag and reports the image as missing.
          if [[ -n "$QUAY_USER" && -n "$QUAY_PASSWORD" ]]; then
            echo "$QUAY_PASSWORD" | docker login --username "$QUAY_USER" --password-stdin "$QUAY_REGISTRY"
          fi

          if docker manifest inspect "$ci_image_push" >/dev/null 2>&1; then
            image_exists=true
          else
            image_exists=false
          fi

          {
            echo "ci_image=${ci_image}"
            echo "image_exists=${image_exists}"
          } >> "$GITHUB_OUTPUT"

          echo "Cache push ref:     ${ci_image_push}"
          echo "Cache pull ref:     ${ci_image}"
          echo "Cache image exists: ${image_exists}"

  build:
    name: Build and publish missing cache image
    if: ${{ needs.metadata.outputs.image_exists != 'true' }}
    needs: metadata
    runs-on: docker-public
    timeout-minutes: 60
    # Consumer workflows call this in parallel on the same commit; without a shared gate
    # they all see image_exists=false and build the same content-addressed tag at once.
    #
    # That gate used to be a `concurrency` group. It cannot be: GitHub allows one
    # running and one *pending* entry per group, and cancels the pending one when a
    # third arrives -- even with cancel-in-progress: false. With three consumers the
    # loser's build was cancelled, and cancellation propagates to the caller, so a whole
    # workflow (unit tests included) ended as "cancelled" on exactly the PRs that change
    # the module graph. STAC-25494. Callers stagger `build_delay_seconds` instead.
    env:
      QUAY_REGISTRY: quay.io
      REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
      REGISTRY_USER: ${{ vars.REGISTRY_USER }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      QUAY_USER: ${{ vars.QUAY_USER }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      BASE_IMAGE_TAG: ${{ inputs.base_image_tag }}
      BUILD_DELAY_SECONDS: ${{ inputs.build_delay_seconds }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build and publish Go dependency cache image
        run: |
          set -euo pipefail
          source .github/scripts/agent-godeps-cache-metadata.sh
          agent_godeps_compute_metadata

          base_image="${REGISTRY_HOST}/quay/stackstate/datadog_build_linux_x64:${BASE_IMAGE_TAG}"

          # Log into both registries: pull the base via the registry.tooling proxy,
          # push the result to quay.io/stackstate.
          echo "$REGISTRY_PASSWORD" | docker login --username "$REGISTRY_USER" --password-stdin "$REGISTRY_HOST"
          echo "$QUAY_PASSWORD" | docker login --username "$QUAY_USER" --password-stdin "$QUAY_REGISTRY"

          # Staggered wait: give the caller designated to build first (delay 0) a full
          # build's worth of time before duplicating its work. Polling before the first
          # build would only waste the delay, which is why the builder gets 0.
          waited=0
          while [ "$waited" -lt "${BUILD_DELAY_SECONDS}" ]; do
            if docker manifest inspect "$ci_image_push" >/dev/null 2>&1; then
              echo "Published by a sibling workflow after ${waited}s: ${ci_image_push}"
              exit 0
            fi
            sleep 20
            waited=$((waited + 20))
          done

          # Backstop: the metadata lookup, and any wait above, can be stale by the time
          # we get here. Pushing the same content-addressed tag twice is harmless, but
          # rebuilding it is not free.
          if docker manifest inspect "$ci_image_push" >/dev/null 2>&1; then
            echo "Already published by a concurrent run: ${ci_image_push}"
            exit 0
          fi

          # Minimal build context: the module manifests (repo paths preserved so
          # nested modules and their local `replace ../` targets resolve) plus the
          # cache Dockerfile. Assembled outside the checkout so `docker build`
          # streams only what the image needs.
          context="$(mktemp -d)"
          mkdir -p "${context}/manifests"
          git ls-files -z -- \
            '*go.mod' '*go.sum' 'go.work' 'go.work.sum' 'modules.yml' \
          | while IFS= read -r -d '' f; do
              mkdir -p "${context}/manifests/$(dirname "$f")"
              cp "$f" "${context}/manifests/${f}"
            done
          cp .github/docker/godeps-cache/Dockerfile "${context}/Dockerfile"

          docker build \
            --pull \
            --build-arg "BASE_IMAGE=${base_image}" \
            --tag "$ci_image_push" \
            "$context"
          docker push "$ci_image_push"
