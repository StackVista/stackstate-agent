# We do not need the pipline_on_commit rules here because it only runs on the main branch commit pipeline.
notify-on-master-fail:
  before_script:
    - apk add --no-cache bash curl
  image: ${REGISTRY_DOCKER_URL}/library/alpine:latest
  only:
    - stackstate-7.51.1
  script:
    - SUITE=build ./.cerberus/cerberus_notify_failure.sh
  stage: report
  tags:
    - sts-k8s-m-runner
  when: on_failure
