.rename_datadog_stackvista: &rename_datadog_stackvista |
  ./fix_package_paths.sh

.configure_debian_env_script: &configure_debian_env_script |
  . /root/miniforge3/etc/profile.d/conda.sh || true # TODO: check possibility to use bash from the start
  . /root/miniconda3/etc/profile.d/conda.sh || true
  conda activate $CONDA_ENV
  mkdir -p /go/src/github.com/StackVista
  rm -rf /go/src/github.com/StackVista/stackstate-agent || true
  . /usr/local/rvm/scripts/rvm
  ln -s $CI_PROJECT_DIR /go/src/github.com/StackVista/stackstate-agent

######################### /pipeline bricks

.artifacts_expire_in: &artifacts_expire_in
  expire_in: 1 week

before_script:
  - *configure_debian_env_script
  - *retrieve_linux_go_deps_script

deps_deb:
  stage: prepare
  tags:
    - sts-k8s-m-arm64-runner
  interruptible: true
  cache:
    key: "deps-deb-$STS_VER-$CI_COMMIT_REF_SLUG-$ARCH"
    paths:
      - vendor
      - venv
  script:
    - go clean -modcache
    - *rename_datadog_stackvista
    - conda activate $CONDA_ENV
    - inv -e deps --verbose
    - go mod tidy
    - go mod vendor
    - inv agent.version --major-version $MAJOR_VERSION -u > version.txt
#    - cd $GOPATH/pkg && tar czf $CI_PROJECT_DIR/go-pkg.tar.gz . || echo "No go-pkg"
#    - cd $GOPATH/pkg && tar czf - . | split -b 800M - $CI_PROJECT_DIR/go-pkg.tar.gz.part. || echo "No go-pkg"
#    - cd $GOPATH/bin && tar czf $CI_PROJECT_DIR/go-bin.tar.gz . || echo "No go-bin"
    - cd $CI_PROJECT_DIR/vendor && tar czf $CI_PROJECT_DIR/vendor.tar.gz . || echo "No vendor"
  artifacts:
    <<: *artifacts_expire_in
    paths:
      - $CI_PROJECT_DIR/version.txt
#      - $CI_PROJECT_DIR/go-pkg.tar.gz.part.*
#      - $CI_PROJECT_DIR/go-bin.tar.gz
      - $CI_PROJECT_DIR/vendor.tar.gz
  retry:
    max: 2
    when:
      - always

