  stage: pre_release
  interruptible: true
  image: registry.tooling.stackstate.io/docker/docker:18.06.0
  needs:
    - build_deb
  variables:
    DOCKER_DRIVER: overlay
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  services:
    - name: registry.tooling.stackstate.io/docker/docker:18.09-dind
      alias: docker
  before_script: []
  script:
    - cd $CI_PROJECT_DIR
    - export VERSION=`cat version.txt`
    - cp ./outcomes/pkg/stackstate-agent_*_arm64.deb ./Dockerfiles/agent
    - ./omnibus/package-scripts/publish_image.sh $CI_COMMIT_REF_NAME $STS_DOCKER_TEST_REPO $CI_PROJECT_DIR/Dockerfiles/agent $CI_COMMIT_SHORT_SHA $STS_DOCKER_K8S_REPO "aarch64"
  tags:
    - sts-k8s-m-arm64-runner
  retry:
    max: 2
    when:
      - always
  rules:
    - when: on_success

pre_release_cluster_agent_image:
  <<: *pre_release_image
  interruptible: true
  needs:
    - build_cluster_agent
  script:
    - cd $CI_PROJECT_DIR
    - cp -r ./bin/stackstate-cluster-agent* ./Dockerfiles/cluster-agent
    - ./omnibus/package-scripts/publish_image.sh $CI_COMMIT_REF_NAME $STS_DOCKER_TEST_REPO_CLUSTER $CI_PROJECT_DIR/Dockerfiles/cluster-agent $CI_COMMIT_SHORT_SHA $STS_DOCKER_K8S_REPO_CLUSTER "aarch64"
  rules:
    - *cluster_agent

# Core Structure for all the beest steps

# Rules
.beest_kubernetes_rule: &kubernetes_ignore_rule
  if: $MAJOR_VERSION == $PRIMARY_MAJOR_VERSION && $CI_COMMIT_MESSAGE =~ /\[beest\-/ && $CI_COMMIT_MESSAGE !~ /\[beest\-kubernetes]/
  when: never

# Jobs
beest_k8s_1_33_containerd_trigger_verification:
  stage: acceptance
  before_script:
    - export PROCESS_AGENT_BRANCH=`cat stackstate-deps.json | jq -r '.PROCESS_AGENT_BRANCH'`
    - export PROCESS_AGENT_VERSION=`cat stackstate-deps.json | jq -r '.PROCESS_AGENT_VERSION'`
  rules:
    - *kubernetes_ignore_rule
    - *merge_train_always
  script:
    - jq -r '.PROCESS_AGENT_BRANCH' stackstate-deps.json > process_agent_branch.txt
    - jq -r '.PROCESS_AGENT_VERSION' stackstate-deps.json > process_agent_version.txt
    - echo "BRANCH_UNDER_TEST=$CI_COMMIT_REF_NAME" >> trigger_vars.env
    - echo "TRIGGER_AGENT_ARM_TESTS=true" >> trigger_vars.env
    - echo "PROCESS_AGENT_BRANCH=$(cat process_agent_branch.txt)" >> trigger_vars.env
    - echo "PROCESS_AGENT_VERSION=$(cat process_agent_version.txt)" >> trigger_vars.env
  artifacts:
    reports:
      dotenv: trigger_vars.env
    paths:
      - process_agent_branch.txt
      - process_agent_version.txt

beest_k8s_1_33_containerd_trigger_verification:
  stage: acceptance
  needs:
    - prepare_beest_trigger
  variables:
    BRANCH_UNDER_TEST: "$CI_COMMIT_REF_NAME"
    TRIGGER_AGENT_ARM_TESTS: "true"
    PROCESS_AGENT_BRANCH: "$PROCESS_AGENT_BRANCH"
    PROCESS_AGENT_VERSION: "$PROCESS_AGENT_VERSION"
  trigger:
    project: stackvista/integrations/beest

## release stage

release_deb:
  interruptible: true
  stage: release
  dependencies:
    - build_deb
  script:
    - cd $CI_PROJECT_DIR/omnibus/package-scripts && ./sign_debian_package.sh
    - cd $CI_PROJECT_DIR/omnibus/package-scripts && ./publish_package.sh $STS_AWS_RELEASE_BUCKET stable
    - cd $CI_PROJECT_DIR && inv release.generate-install
    - cd $CI_PROJECT_DIR/cmd/agent && aws.rb -e "Aws::S3::Resource.new.bucket(ENV['STS_AWS_RELEASE_BUCKET']).object('install.sh').upload_file('./install.sh', acl:'public-read')"
  rules:
    - if: $CI_COMMIT_TAG || $CI_PIPELINE_TRIGGERED == 'true'
      when: manual
  retry:
    max: 2
    when:
      - always

release_rpm:
  interruptible: true
  stage: release
  image: registry.tooling.stackstate.io/quay/stackstate/stackstate-agent-runner-gitlab:deb-rpmpublisher
  dependencies:
    - build_rpm
  before_script:
    - mkdir -p /go/src/github.com/StackVista
    - ln -s $CI_PROJECT_DIR /go/src/github.com/StackVista/stackstate-agent
  script:
    - cd $CI_PROJECT_DIR/omnibus/package-scripts && ./sign_rpm_package.sh
    - cd $CI_PROJECT_DIR/omnibus/package-scripts && ./publish_package_rpm.sh $STS_AWS_RELEASE_BUCKET_YUM stable
  rules:
    - if: $CI_COMMIT_TAG || $CI_PIPELINE_TRIGGERED == 'true'
      when: manual
  retry:
    max: 2
    when:
      - always

.base_release_image: &base_release_image
  stage: release
  image: registry.tooling.stackstate.io/docker/docker:20-git
  dependencies:
    - build_deb
  variables:
    DOCKER_DRIVER: overlay
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  services:
    - name: registry.tooling.stackstate.io/docker/docker:20-dind
      alias: docker
  before_script: []
  tags:
    - sts-k8s-m-arm64-runner
  retry:
    max: 2
    when:
      - always

release_main_agent_image:
  <<: *base_release_image
  interruptible: true
  script:
    - cd $CI_PROJECT_DIR
    - export VERSION=`cat version.txt`
    - cp ./outcomes/pkg/stackstate-agent_*_arm64.deb Dockerfiles/agent
    - ./omnibus/package-scripts/publish_image.sh $VERSION $STS_DOCKER_RELEASE_REPO $CI_PROJECT_DIR/Dockerfiles/agent latest
  rules:
    - if: $CI_COMMIT_TAG || $CI_PIPELINE_TRIGGERED == 'true'
      when: manual

release_cluster_agent_image:
  <<: *base_release_image
  interruptible: true
  dependencies:
    - build_cluster_agent
  script:
    - cd $CI_PROJECT_DIR
    - export VERSION=`cat version.txt`
    - cp -r ./bin/stackstate-cluster-agent/* ./Dockerfiles/cluster-agent
    - ./omnibus/package-scripts/publish_image.sh $VERSION $STS_DOCKER_RELEASE_REPO_CLUSTER $CI_PROJECT_DIR/Dockerfiles/cluster-agent latest
  rules:
    - *cluster_agent_release

