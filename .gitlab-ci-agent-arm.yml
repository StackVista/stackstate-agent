pre_release_main_agent_image: &pre_release_image
  stage: pre_release
  interruptible: true
  image: ${REGISTRY_DOCKER_URL}/library/docker:18.06.0
  needs:
    - build_deb
  variables:
    DOCKER_DRIVER: overlay
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  services:
    - name: ${REGISTRY_DOCKER_URL}/library/docker:18.09-dind
      alias: docker
  before_script: []
  script:
    - cd $CI_PROJECT_DIR
    - export VERSION=`cat version.txt`
    - cp ./outcomes/pkg/stackstate-agent_*_arm64.deb ./Dockerfiles/agent
    - ./omnibus/package-scripts/publish_image.sh $CI_COMMIT_REF_NAME $STS_DOCKER_TEST_REPO $CI_PROJECT_DIR/Dockerfiles/agent $CI_COMMIT_SHORT_SHA "aarch64"
  tags:
    - sts-k8s-m-arm64-runner
  retry:
    max: 2
    when:
      - always
  rules:
    - when: on_success

pre_release_cluster_agent_image:
  <<: *pre_release_image
  interruptible: true
  needs:
    - build_cluster_agent
  script:
    - cd $CI_PROJECT_DIR
    - cp -r ./bin/stackstate-cluster-agent* ./Dockerfiles/cluster-agent
    - ./omnibus/package-scripts/publish_image.sh $CI_COMMIT_REF_NAME $STS_DOCKER_TEST_REPO_CLUSTER $CI_PROJECT_DIR/Dockerfiles/cluster-agent $CI_COMMIT_SHORT_SHA "aarch64"


