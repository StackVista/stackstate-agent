## build stage

unit_tests:
  stage: test
  interruptible: true
  needs:
    - deps_deb
  script:
    - go clean -modcache
    - *rename_datadog_stackvista
    - conda activate $CONDA_ENV
    - inv -e deps --verbose
    - go mod tidy
    - go mod vendor
    # We run inv deps again because /go/bin is not cached and we need binaries like golint, misspell
    - inv deps
    - BRANDED=false inv -e agent.build --race --major-version $MAJOR_VERSION --python-runtimes $PYTHON_RUNTIMES
    # TODO: check why formatting rules differ from previous step
    - gofmt -l -w -s ./pkg ./cmd
    - inv -e rtloader.test
    - invoke install-tools
    - echo "inv -e test --coverage --race --profile --cpus 4 --major-version $MAJOR_VERSION --python-runtimes $PYTHON_RUNTIMES"
    - inv -e test --coverage --race --profile --cpus 4 --major-version $MAJOR_VERSION --python-runtimes $PYTHON_RUNTIMES
  tags:
    - sts-k8s-xl-arm64-runner
  retry:
    max: 2
    when:
      - always
  rules:
    - when: on_success
  timeout: 120 minutes

filename_linting:
  stage: test
  tags:
    - sts-k8s-m-arm64-runner
  interruptible: true
  needs:
    - deps_deb
  script:
    - go clean -modcache
    - *rename_datadog_stackvista
    - conda activate $CONDA_ENV
    - inv -e deps --verbose
    - go mod tidy
    - go mod vendor
    - inv -e lint-filenames
  rules:
    - when: on_success
  retry:
    max: 2
    when:
      - always

build_binaries:
  stage: build
  interruptible: true
  needs:
    - deps_deb
  script:
    - go clean -modcache
    - *rename_datadog_stackvista
    - conda activate $CONDA_ENV
    - inv -e deps --verbose
    - go mod tidy
    - go mod vendor
    - inv -e dogstatsd.build --static --major-version $MAJOR_VERSION
    - inv -e rtloader.make
    - inv -e rtloader.install
    - cd $SRC_PATH
    - inv -e agent.build --major-version $MAJOR_VERSION --python-runtimes $PYTHON_RUNTIMES
  tags:
    - sts-k8s-xl-arm64-runner
  retry:
    max: 2
    when:
      - always
  rules:
    - when: on_success

build_cluster_agent:
  stage: build
  interruptible: true
  needs:
    - deps_deb
  script:
    - go clean -modcache
    - *rename_datadog_stackvista
    - conda activate $CONDA_ENV
    - inv -e deps --verbose
    - go mod tidy
    - go mod vendor
    - inv -e cluster-agent.build
    - ls -la $CI_PROJECT_DIR/bin/
  artifacts:
    paths:
      - $CI_PROJECT_DIR/bin/stackstate-cluster-agent
      - $CI_PROJECT_DIR/Dockerfiles/cluster-agent/stackstate-cluster.yaml
      - $CI_PROJECT_DIR/version.txt
    <<: *artifacts_expire_in
  tags:
    - sts-k8s-xl-arm64-runner
  retry:
    max: 2
    when:
      - always

build_deb:
  stage: build
  interruptible: true
  needs:
    - deps_deb
  tags:
    - sts-k8s-xl-arm64-runner
  variables:
      PACKAGE_ARCH: arm64
      DD_PKG_ARCH: arm64
      STS_PKG_ARCH: arm64
  cache:
    key: "build-deb-$STS_VER-$CI_COMMIT_REF_SLUG-$ARCH"
    paths:
      - .omnibus
      - .gems
  script:
    # We move .omnibus out of the CI root because this seems to cause issues with git
    # cloning in omnibus and operations on datadog-agent
    - mv $CI_PROJECT_DIR/.omnibus /omnibus || mkdir -p /omnibus

    - go clean -modcache
    - *rename_datadog_stackvista
    - conda activate $CONDA_ENV
    - inv -e deps --verbose
    - go mod tidy
    - go mod vendor
    - inv agent.version --major-version $MAJOR_VERSION
    - cat version.txt || true
    - source ./.gitlab-scripts/setup_artifactory.sh
    - export LD_LIBRARY_PATH="/opt/stackstate-agent/embedded/lib/python3.11/site-packages/psycopg2_binary.libs:/opt/stackstate-agent/embedded/lib"
    - echo ${LD_LIBRARY_PATH}
    - inv -e agent.omnibus-build --gem-path $CI_PROJECT_DIR/.gems --base-dir $OMNIBUS_BASE_DIR --go-mod-cache $CI_PROJECT_DIR/vendor --skip-deps --skip-sign --major-version $MAJOR_VERSION --python-runtimes $PYTHON_RUNTIMES

    # Prepare outputs
    - mkdir -p $CI_PROJECT_DIR/outcomes/pkg && mkdir -p $CI_PROJECT_DIR/outcomes/dockerfiles && mkdir -p $CI_PROJECT_DIR/outcomes/binary
    - cp -r $OMNIBUS_BASE_DIR/pkg $CI_PROJECT_DIR/outcomes
    - cp -r $CI_PROJECT_DIR/Dockerfiles $CI_PROJECT_DIR/outcomes
#    - cp -r /opt/stackstate-agent/embedded/bin/trace-agent  $CI_PROJECT_DIR/outcomes/binary/

    - ls -la $CI_PROJECT_DIR/outcomes/Dockerfiles

    # Prepare cache
    # Drop packages for cache
    - rm -rf /omnibus/pkg
    # Drop agent for cache (will be resynced anyway)
    - rm -rf /omnibus/src/datadog-agent
    # Drop symlink because it will fail the build when coming from a cache
    - rm /omnibus/src/datadog-agent/src/github.com/StackVista/stackstate-agent/vendor/github.com/coreos/etcd/cmd/etcd || echo "Not found"
    - mv /omnibus $CI_PROJECT_DIR/.omnibus
  artifacts:
    paths:
      - $CI_PROJECT_DIR/outcomes/pkg/*.deb
      - $CI_PROJECT_DIR/outcomes/pkg/*.json
      - $CI_PROJECT_DIR/outcomes/Dockerfiles/agent
      - $CI_PROJECT_DIR/outcomes/Dockerfiles/cluster-agent
      - $CI_PROJECT_DIR/outcomes/Dockerfiles/dogstatsd
      - $CI_PROJECT_DIR/outcomes/Dockerfiles/manifests
      - $CI_PROJECT_DIR/version.txt
    <<: *artifacts_expire_in
  retry:
    max: 2
    when:
      - always
  rules:
    - when: on_success

