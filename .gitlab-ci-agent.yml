## build stage

unbranded_unit_tests:
  stage: test
  interruptible: true
  needs:
    - deps_deb
  script:
    - export PATH=$PATH:/usr/local/go/bin
    - go clean -modcache
#    - *rename_datadog_stackvista
    - conda activate $CONDA_ENV
    - go work sync
    - go work vendor
    - inv -e deps --verbose
    # We run inv deps again because /go/bin is not cached and we need binaries like golint, misspell
    - inv deps
    - export AGENT_GITHUB_ORG=DataDog
    - export GITHUB_ORG=DataDog
    - export BRANDED=false
    - export AGENT_REPO_NAME=datadog-agent
    - inv -e agent.build --race
    # TODO: check why formatting rules differ from previous step
    - gofmt -l -w -s ./pkg ./cmd
    - inv -e rtloader.test
    - invoke install-tools
    # STS: Go 1.25 no longer ships prebuilt tool binaries (covdata, etc.).
    # When the toolchain is auto-downloaded at runtime the tool-resolution
    # path is broken for `go test -cover` on packages without test files
    # (golang/go#75031). Work around by building covdata into GOTOOLDIR.
    - go build -o "$(go env GOTOOLDIR)/covdata" cmd/covdata
    # STS: drop build tags for features StackState does not ship in the
    # cluster-agent / node-agent images: oracle DB monitoring, trivy SBOM
    # scanning, NVIDIA GPU/Jetson hardware support, the Datadog installer
    # bundling, and host systemd integration (containers don't use systemd
    # and our agent.build already runs with --build-exclude=systemd).
    - export STS_UT_BUILD_EXCLUDE="oracle,trivy,trivy_no_javadb,nvml,jetson,bundle_installer,systemd"
    # STS: bump per-package -timeout from 180s to 600s. Tests like
    # pkg/collector/corechecks/servicediscovery/apm.TestGoDetector shell out to
    # `go build` to compile fixture binaries; with our cold modcache (we run
    # `go clean -modcache` at the top of each job) those subprocesses can blow
    # the 3-minute default on a busy runner.
    - echo "inv -e test --coverage --race --profile --cpus 4 --build-exclude=$STS_UT_BUILD_EXCLUDE --timeout=600"
    - inv -e test --coverage --race --profile --cpus 4 --build-exclude=$STS_UT_BUILD_EXCLUDE --timeout=600
  tags:
    - ${RUNNER_TAG_XL}
  retry:
    max: 2
    when:
      - always
  rules:
    - when: on_success
  timeout: 120 minutes

