pre_release_main_agent_image: &pre_release_image
  stage: pre_release
  interruptible: true
  image: ${REGISTRY_DOCKER_URL}/library/docker:24-git
  needs:
    - build_deb
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_TLS_CERTDIR: ""
  services:
    - name: ${REGISTRY_DOCKER_URL}/library/docker:24-dind
      alias: docker
  before_script:
    # docker:24-git is Alpine and ships ash only; build-and-label.sh and
    # oci-labels.sh require bash (mapfile, [[ ]], ${!var}, arrays).
    - apk add --no-cache bash
  script:
    - cd $CI_PROJECT_DIR
    - export VERSION=`cat version.txt`
    - cp ./outcomes/pkg/stackstate-agent_*_${PKG_ARCH_SUFFIX}.deb ./Dockerfiles/agent
    - ./omnibus/package-scripts/publish_image.sh $CI_COMMIT_REF_NAME $STS_DOCKER_TEST_REPO $CI_PROJECT_DIR/Dockerfiles/agent $CI_COMMIT_SHORT_SHA "${DOCKER_ARCH}"
  tags:
    - ${RUNNER_TAG_M}
  retry:
    max: 2
    when:
      - always
  rules:
    - when: on_success

pre_release_cluster_agent_image:
  <<: *pre_release_image
  interruptible: true
  needs:
    - build_cluster_agent
  script:
    - cd $CI_PROJECT_DIR
    - cp -r ./bin/stackstate-cluster-agent* ./Dockerfiles/cluster-agent
    - ./omnibus/package-scripts/publish_image.sh $CI_COMMIT_REF_NAME $STS_DOCKER_TEST_REPO_CLUSTER $CI_PROJECT_DIR/Dockerfiles/cluster-agent $CI_COMMIT_SHORT_SHA "${DOCKER_ARCH}"
  rules:
    - when: on_success
