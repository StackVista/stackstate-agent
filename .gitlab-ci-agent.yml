build_deb:
  stage: build
  interruptible: true
  needs:
    - deps_deb
  tags:
    - ${RUNNER_TAG_XL}
  variables:
    PACKAGE_ARCH: ${PACKAGE_ARCH}
    DD_PKG_ARCH: ${DD_PKG_ARCH}
    STS_PKG_ARCH: ${STS_PKG_ARCH}
    # [sts] DD 7.78 added Bazel-based dependency builds in
    # omnibus/config/software/datadog-agent-dependencies.rb (bazelisk run @nghttp2//:install,
    # @curl//:install, //packages/agent/dependencies:install). bazelisk requires
    # XDG_CACHE_HOME to be a valid directory in CI; without it the omnibus build
    # fails with "🔴 XDG_CACHE_HOME () must denote a directory in CI!" during the
    # openssl3 build step. Mirrors DD's .gitlab/build/bazel/defs.yml pattern.
    XDG_CACHE_HOME: "$CI_PROJECT_DIR/.cache"
    BAZELISK_HOME: "$CI_PROJECT_DIR/.cache/bazelisk"
    # [sts] STAC-0 — enable the omnibus GIT cache (the build-skip layer). omnibus
    # snapshots install_dir (/opt/stackstate-agent) into a git repo per built
    # software and checks it back out on the next run instead of recompiling
    # openssl/cpython/openscap/sqlite/msodbcsql/etc. Persisted across runs via the
    # .omnibus-git-cache path in the cache: block below. Drives
    # use_omnibus_git_cache in tasks/omnibus.py. NOTE: the .omnibus base_dir cache
    # only persists downloaded/extracted SOURCES — it does NOT skip compiles; the
    # git cache is what recovers the ~25-30 min of per-pipeline bazelisk/make time.
    OMNIBUS_GIT_CACHE_DIR: "$CI_PROJECT_DIR/.omnibus-git-cache"
  # [sts] STAC-24773 + STAC-0 — cache wiring for the omnibus-driven build_deb job.
  #
  # The first key persists (a) omnibus base_dir (.omnibus: downloaded/extracted
  # sources) + .gems, and (b) the omnibus GIT cache (.omnibus-git-cache) — the
  # actual build-skip layer (STAC-0): omnibus checks previously-built software
  # back out of a git snapshot of install_dir instead of recompiling. The
  # base_dir cache ALONE does not skip compiles. fallback_keys warm-starts a new
  # branch from the base branch's cache. The second key persists bazel + bazelisk install
  # bases (skips bazel server bootstrap). The third key persists bazel's
  # repository_cache — the http_archive source tarball cache that holds
  # @cpython, @sqlite3, @openscap source archives etc. fetched from upstream.
  #
  # We tried also persisting --disk_cache here (action cache + CAS), but the
  # omnibus-invoked `bazelisk run @cpython//:install` pattern produced zero
  # disk_cache entries across full builds (one-off diagnostic in commit
  # babe1fa373 confirmed: 0 files in .cache/bazel-disk/cas and /ac after the
  # build, 691M restored in .cache/bazel-repo). The suspected cause is
  # rules_foreign_cc.configure_make's tree-artifact outputs (out_data_dirs,
  # out_include_dir) plus `bazel run` semantics — DataDog upstream relies on
  # the buildbarn remote cache via .bazelrc's `:cache` config which STS can't
  # reach. Net effect: --disk_cache wiring was inert, so dropped.
  #
  # Inlined (not `extends:`) because STS pipelines don't `include:` the
  # upstream .gitlab/build/bazel/defs.yml. user.bazelrc cache pointers are
  # written in before_script via the upstream-blessed extension point:
  # `try-import %workspace%/user.bazelrc` at .bazelrc:75.
  cache:
    - key: "build-deb-omnibus-$STS_VER-$CI_COMMIT_REF_SLUG-$ARCH"
      fallback_keys:
        - "build-deb-omnibus-$STS_VER-stackstate-7-78-2-$ARCH"
      paths:
        - .omnibus
        - .gems
        - .omnibus-git-cache
    - key:
        prefix: build-deb-bazel-install-$STS_VER-$ARCH
        files:
          - .bazelversion
      paths:
        - .cache/bazelisk
        - .cache/bazel/install
      when: on_success
    - key:
        prefix: build-deb-bazel-repo-$STS_VER-$ARCH
        files:
          - .bazelversion
          - .python-version
      paths:
        - .cache/bazel-repo
      when: on_success
  before_script:
    # [sts] STAC-24773 — explicit pass-through of the top-level before_script
    # (conda activate, GOPATH symlink, go-bin/go-pkg/vendor tarball extraction).
    # A job-level before_script REPLACES the file-level one, so we must restate
    # it here. Then add the Bazel cache setup so user.bazelrc exists before any
    # bazelisk shell-out from omnibus runs.
    - . /root/miniforge3/etc/profile.d/conda.sh || true
    - conda activate $CONDA_ENV
    - mkdir -p /go/src/github.com/StackVista
    - rm -rf /go/src/github.com/StackVista/stackstate-agent || true
    - . /usr/local/rvm/scripts/rvm
    - ln -s $CI_PROJECT_DIR /go/src/github.com/StackVista/stackstate-agent
    - echo "~~~~~> Trying to retrieve_linux_go_deps"
    - ls *.tar.gz || true
    - '[ -e "go-bin.tar.gz" ] && mkdir -p $GOPATH/bin && tar xzf go-bin.tar.gz -C $GOPATH/bin || true'
    - '[ -e "go-pkg.tar.gz.part.aa" ] && mkdir -p $GOPATH/pkg && cat go-pkg.tar.gz.part.* | tar xz  -C $GOPATH/pkg || true'
    - '[ -e "vendor.tar.gz" ] && mkdir vendor && tar xzf vendor.tar.gz -C vendor || true'
    - rm -f go-bin.tar.gz go-pkg.tar.gz.part.* vendor.tar.gz || true
    - echo "~~~~~> /Trying..."
    # Bazel cache setup: write user.bazelrc to pin Bazel state under
    # $XDG_CACHE_HOME so it lines up with the cache: paths above. Affects every
    # bazelisk shell-out from omnibus .rb files automatically via .bazelrc's
    # `try-import %workspace%/user.bazelrc`. /user.bazelrc is gitignored.
    - mkdir -p "$CI_PROJECT_DIR/.cache/bazel" "$CI_PROJECT_DIR/.cache/bazel-repo" "$CI_PROJECT_DIR/.cache/bazelisk" "$CI_PROJECT_DIR/.omnibus-git-cache"
    - |
      cat > "$CI_PROJECT_DIR/user.bazelrc" <<EOF
      # [sts] STAC-24773 — generated by build_deb job; do not commit.
      startup --output_user_root=$CI_PROJECT_DIR/.cache/bazel
      common --repository_cache=$CI_PROJECT_DIR/.cache/bazel-repo
      EOF
    - echo "===== user.bazelrc ====="; cat "$CI_PROJECT_DIR/user.bazelrc"
  script:
    - export PATH=$PATH:/usr/local/go/bin
    - export AGENT_GITHUB_ORG=DataDog
    - export GITHUB_ORG=DataDog
    - export BRANDED=true
    - export AGENT_REPO_NAME=datadog-agent
    - export OMNIBUS_FORCE_PACKAGES=true
    - if [ "$(echo "${BRANDED}" | tr '[:upper:]' '[:lower:]')" = "true" ]; then ./fix_branding.sh; fi
    # We move .omnibus out of the CI root because this seems to cause issues with git
    # cloning in omnibus and operations on datadog-agent
    - mv $CI_PROJECT_DIR/.omnibus /omnibus || mkdir -p /omnibus

    - go clean -modcache
#    - *rename_datadog_stackvista
    - conda activate $CONDA_ENV
    - go work sync
    - go work vendor
    - inv -e deps --verbose
    - inv agent.version  # [sts] DD 7.78 removed --major-version from inv agent.version
    - cat version.txt || true
    - source ./.gitlab-scripts/setup_artifact_registry.sh
    - export LD_LIBRARY_PATH="/opt/stackstate-agent/embedded/lib/python3.12/site-packages/psycopg2_binary.libs:/opt/stackstate-agent/embedded/lib"
    - echo ${LD_LIBRARY_PATH}
    - inv -e omnibus.build --gem-path $CI_PROJECT_DIR/.gems --base-dir $OMNIBUS_BASE_DIR --go-mod-cache $CI_PROJECT_DIR/vendor --skip-deps --skip-sign

    # Prepare outputs
    - mkdir -p $CI_PROJECT_DIR/outcomes/pkg && mkdir -p $CI_PROJECT_DIR/outcomes/dockerfiles && mkdir -p $CI_PROJECT_DIR/outcomes/binary
    - cp -r $OMNIBUS_BASE_DIR/pkg $CI_PROJECT_DIR/outcomes
    - cp -r $CI_PROJECT_DIR/Dockerfiles $CI_PROJECT_DIR/outcomes
#    - cp -r /opt/stackstate-agent/embedded/bin/trace-agent  $CI_PROJECT_DIR/outcomes/binary/

    - ls -la $CI_PROJECT_DIR/outcomes/Dockerfiles

    # Prepare cache
    # Drop packages for cache
    - rm -rf /omnibus/pkg
    # Drop agent for cache (will be resynced anyway)
    - rm -rf /omnibus/src/datadog-agent
    # Drop symlink because it will fail the build when coming from a cache
    - rm /omnibus/src/datadog-agent/src/github.com/StackVista/stackstate-agent/vendor/github.com/coreos/etcd/cmd/etcd || echo "Not found"
    - mv /omnibus $CI_PROJECT_DIR/.omnibus
  artifacts:
    paths:
      - $CI_PROJECT_DIR/outcomes/pkg/*.deb
      - $CI_PROJECT_DIR/outcomes/pkg/*.json
      - $CI_PROJECT_DIR/outcomes/Dockerfiles/agent
      - $CI_PROJECT_DIR/outcomes/Dockerfiles/cluster-agent
      - $CI_PROJECT_DIR/outcomes/Dockerfiles/dogstatsd
      - $CI_PROJECT_DIR/outcomes/Dockerfiles/manifests
      - $CI_PROJECT_DIR/version.txt
    <<: *artifacts_expire_in
  retry:
    max: 2
    when:
      - always
  rules:
    - when: on_success

